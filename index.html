<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rookies Chess</title>
<style>
  :root{--navy:#13213F;--panel:#0C1630;--bezel:#2A3550;--ivory:#F3E8D2;--red:#C8323A;--amber:#FFC24A;--muted:#B3BCD2}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--navy);color:var(--ivory);
    font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background-image:radial-gradient(900px 480px at 50% -10%, #24396A, rgba(36,57,106,0) 60%);
    display:flex;align-items:center;justify-content:center;padding:40px 22px}
  .wrap{max-width:560px;text-align:center}
  .tiles{display:inline-flex;gap:5px;margin-bottom:10px}
  .tile{background:var(--red);color:var(--ivory);font-weight:800;font-size:26px;padding:4px 11px;border-radius:6px;
    box-shadow:inset 0 0 0 2px rgba(255,255,255,.45)}
  .script{font-style:italic;font-size:22px;color:var(--ivory);opacity:.9;margin-bottom:18px}
  p.lead{font-size:18px;color:#dfd4bb}
  .links{margin-top:28px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  a.btn{display:inline-block;background:var(--panel);border:1px solid var(--bezel);border-radius:12px;
    padding:12px 20px;color:var(--amber);text-decoration:none;font-weight:600}
  a.btn:hover{border-color:var(--amber)}
  footer{margin-top:34px;color:var(--muted);font-size:13px}
</style>
</head>
<body>
  <div class="wrap">
    <div class="tiles"><span class="tile">R</span><span class="tile">O</span><span class="tile">O</span><span class="tile">K</span><span class="tile">I</span><span class="tile">E</span><span class="tile">S</span></div>
    <div class="script">Chess Club</div>
    <p class="lead">A learn and play chess club for all ages. Bite size drills, real games against the bot or a friend, and a coach who turns every match into your next lesson.</p>
    <div class="links">
      <a class="btn" href="privacy.html">Privacy Policy</a>
      <a class="btn" href="support.html">Support</a>
    </div>
    <footer>© 2026 Rookies Chess. Coming to the App Store.</footer>
  </div>
</body>
</html>
